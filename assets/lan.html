<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>局域网互传 · 极速下载器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#2f6fed;--pd:#1f55c8;--bg:#f2f5fb;--card:#fff;--text:#1e2536;--sub:#7b869c;--line:#e4e9f2;--red:#e05252;--mine:#dbe7ff}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{background:linear-gradient(135deg,#2f6fed,#5b9bff);color:#fff;padding:26px 20px 30px;margin:0 -16px 18px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
header p{margin:6px 0 0;font-size:12px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(31,55,110,.05)}
.card h2{margin:0 0 14px;font-size:15px;font-weight:700}
label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px}
input[type=text],input[type=number]{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fafbfe;color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.code-input{font-size:26px!important;letter-spacing:8px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 20px;border:0;border-radius:10px;background:var(--p);color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.full{width:100%;margin-top:18px}
.btn.ghost{background:#edf2fd;color:var(--p)}
.btn.gray{background:#f0f2f6;color:var(--sub)}
.btn.red{background:#fdeeee;color:var(--red)}
.btn.sm{height:32px;padding:0 14px;font-size:12px;border-radius:8px}
.hidden{display:none!important}
.codebig{font-size:40px;font-weight:800;letter-spacing:10px;color:var(--p);text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.addr{text-align:center;color:var(--sub);font-size:13px;word-break:break-all;user-select:all}
.tip{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.badge{display:inline-block;background:#eaf1ff;color:var(--p);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
.peers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.peer{background:#f1f5fc;border-radius:16px;padding:3px 10px;font-size:11px;color:#5a6a88}
.qrbox{margin:14px auto 0;width:200px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.qrbox img{display:block;width:100%;height:auto}
.qrhint{font-size:11px;color:var(--sub);margin-top:8px}
.foot{text-align:center;color:#a3adc0;font-size:11px;margin-top:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal-in{background:#fff;border-radius:14px;padding:14px;max-width:94vw;max-height:90vh;overflow:auto;text-align:center}
.modal-in img,.modal-in video,.modal-in audio{max-width:88vw;max-height:78vh;border-radius:8px}
.modal-in .btn{margin-top:10px}

#chat{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px;background:#f7f9fd;border-radius:12px;margin-top:10px}
.msg{display:flex;flex-direction:column;max-width:82%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:10px;color:var(--sub);margin:0 4px 2px}
.bubble{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;word-break:break-all;box-shadow:0 1px 4px rgba(31,55,110,.04)}
.msg.mine .bubble{background:var(--mine);border-color:#c6dbff}
.bubble .fn{font-weight:600}
.bubble .meta{font-size:11px;color:var(--sub);margin-top:2px}
.bubble .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bubble .acts a,.bubble .acts button{height:28px;padding:0 10px;font-size:11px;border-radius:7px;border:0;background:var(--p);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.bubble .acts .g{background:#edf2fd;color:var(--p)}
.bubble .acts .r{background:#fdeeee;color:var(--red)}
.chatbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chatbar input[type=text]{flex:1;min-width:140px}
.chatbar .btn{height:42px}
.uprow{display:flex;gap:8px;margin-top:10px}
.uprow .btn{flex:1}
.newmsg{position:absolute;right:18px;bottom:96px;z-index:5;background:var(--p);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(31,55,110,.25)}
.newmsg:active{transform:scale(.96)}
.roomtools{display:flex;gap:8px;justify-content:flex-end;margin:-6px 0 8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>局域网互传</h1>
<p>同一 Wi-Fi 下，输入房间口令即可与手机、电脑互传文件，像聊天一样收发</p>
</header>

<section id="gate" class="card">
<h2>加入房间</h2>
<label>数字口令码</label>
<input id="code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="····" autocomplete="off">
<label>我的昵称</label>
<input id="name" type="text" maxlength="20" placeholder="留空自动命名">
<button id="btnJoin" class="btn full">加入房间</button>
<div id="gateErr" class="tip err" style="color:var(--red)"></div>
<div class="tip">口令由手机端「开启房间」生成，与端口号不同。也可以直接扫描主机 App 上的二维码打开带口令的链接，免手打。数据只在本局域网内传输，不经过任何服务器。</div>
</section>

<section id="room" class="hidden">
<div class="card" style="text-align:center">
<div class="badge" id="online">0 人在线</div>
<div class="codebig" id="roomCode">----</div>
<div class="addr" id="roomAddr">-</div>
<div class="qrbox"><img id="qr" alt="房间二维码"></div>
<div class="qrhint">其他人扫此码，即可带着口令直接进入本房间</div>
<div class="peers" id="peers"></div>
</div>

<div class="card" style="position:relative">
<h2>聊天 · 文件互传</h2>
<div class="roomtools">
<button id="btnClear" class="btn gray sm">清空聊天</button>
<button id="btnLeaveRoom" class="btn red sm">离开房间</button>
</div>
<div id="chat"></div>
<button id="newMsg" class="newmsg hidden">↓ 新消息</button>
<div class="chatbar">
<input id="text" type="text" placeholder="说点什么…" maxlength="2000">
<button id="btnSend" class="btn">发送</button>
</div>
<div class="uprow">
<button id="btnFile" class="btn ghost">上传文件</button>
<button id="btnFolder" class="btn gray">上传文件夹</button>
</div>
<input id="file" type="file" multiple class="hidden">
<input id="folder" type="file" webkitdirectory multiple class="hidden">
<div id="upStatus" class="tip"></div>
</div>
</section>

<div id="pvModal" class="modal hidden"><div class="modal-in"><div id="pvBody"></div><button class="btn gray sm" id="pvClose">关闭</button></div></div>

<div id="cfModal" class="modal hidden"><div class="modal-in"><div id="cfText" style="font-size:14px;line-height:1.7;padding:4px 2px"></div><div class="bar" style="justify-content:center;margin-top:14px"><button id="cfNo" class="btn gray sm">取消</button><button id="cfYes" class="btn red sm">确认</button></div></div></div>

<div class="foot">极速下载器 · 局域网互传 · 不经过公网服务器</div>
</div>

<script>
var CODE = sessionStorage.getItem('lan_code') || '';
var NAME = sessionStorage.getItem('lan_name') || '';
var ME = sessionStorage.getItem('lan_me') || (Math.random().toString(36).slice(2,10));
sessionStorage.setItem('lan_me', ME);
var AUTO = false;
try {
  var urlCode = new URLSearchParams(location.search).get('code') || '';
  if (/^[0-9]{4,8}$/.test(urlCode)) { CODE = urlCode; AUTO = true; sessionStorage.setItem('lan_code', CODE); }
} catch(e) { }
var $ = function(id){ return document.getElementById(id); };
var timer = null;
var seenTs = 0;
var lastMaxT = 0;
var clearTs = parseInt(sessionStorage.getItem('lan_clear_ts')||'0',10)||0; // 本地清空时间戳：早于此的消息不显示（仅自己生效）

function qs(o){ return Object.keys(o).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(o[k]); }).join('&'); }
function fmtSize(b){ if(!b||b<0) return '未知'; var u=['B','KB','MB','GB','TB'],i=0,v=b; while(v>=1024&&i<u.length-1){v/=1024;i++;} return (v>=100?Math.round(v):v.toFixed(v>=10?1:2))+' '+u[i]; }
function fmtTime(t){ try{ return new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function setStatus(s,err){ var e=$('upStatus'); e.textContent=s||''; e.style.color=err?'var(--red)':'var(--sub)'; }
function mediaType(name){ var e=(name.split('.').pop()||'').toLowerCase();
  var img=['jpg','jpeg','png','gif','webp','bmp','heic','heif'], vid=['mp4','m4v','mov','avi','mkv','webm','3gp','3gpp','flv','wmv'], aud=['mp3','wav','ogg','oga','m4a','aac','flac','wma','amr','opus'];
  if(img.indexOf(e)>=0) return 'image'; if(vid.indexOf(e)>=0) return 'video'; if(aud.indexOf(e)>=0) return 'audio'; return ''; }
function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

if(!NAME){ NAME='浏览器-'+Math.floor(100+Math.random()*900); }
$('name').value = sessionStorage.getItem('lan_name') || '';
$('code').value = CODE;

function query(path,o){ return fetch(path+'?'+qs(o),{cache:'no-store'}).then(function(r){ return r.json(); }); }

function join(){
  var c=($('code').value||'').trim();
  if(!/^[0-9]{4,8}$/.test(c)){ $('gateErr').textContent='请输入 4 位以上的数字口令'; return; }
  var n=($('name').value||'').trim() || NAME;
  $('btnJoin').disabled=true; $('btnJoin').textContent='连接中…'; $('gateErr').textContent='';
  query('/api/join',{code:c,name:n}).then(function(d){
    if(!d.ok){ throw new Error(d.msg||'口令不正确'); }
    CODE=c; NAME=n;
    sessionStorage.setItem('lan_code',CODE); sessionStorage.setItem('lan_name',NAME);
    enter();
  }).catch(function(e){
    $('gateErr').textContent=e.message||'连接失败';
    $('btnJoin').disabled=false; $('btnJoin').textContent='加入房间';
  });
}

function enter(){
  $('gate').classList.add('hidden'); $('room').classList.remove('hidden');
  $('roomCode').textContent=CODE;
  $('roomAddr').textContent=location.host;
  $('qr').src='/api/qr?code='+encodeURIComponent(CODE);
  poll();
  if(timer) clearInterval(timer);
  timer=setInterval(poll,3000);
}

function poll(){
  query('/api/chat',{code:CODE,name:NAME,me:ME}).then(function(d){
    if(!d.ok){ $('chat').innerHTML='<div class="tip">房间已关闭或口令失效</div>'; return; }
    render(d.msgs||[]);
  }).catch(function(){});
}

function render(allMsgs){
  var msgs = (allMsgs||[]).filter(function(m){ return (m.time||0) > clearTs; }); // 本地清空：过滤早于清空时间的消息
  var box=$('chat');
  if(!msgs.length){ box.innerHTML='<div class="tip">还没有消息，发条消息或上传文件试试～</div>'; seenTs=0; $('newMsg').classList.add('hidden'); return; }
  var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  lastMaxT = 0;
  msgs.forEach(function(m){ if(m.time>lastMaxT) lastMaxT=m.time; });
  if(seenTs===0) seenTs = lastMaxT; // 进入房间时把已有消息标记为已读
  box.innerHTML='';
  msgs.forEach(function(m){
    var mine = m.fromId === ME;
    var wrap=document.createElement('div'); wrap.className='msg'+(mine?' mine':'');
    if(!mine && m.fromName){ var w=document.createElement('div'); w.className='who'; w.textContent=m.fromName; wrap.appendChild(w); }
    var b=document.createElement('div'); b.className='bubble';
    if(m.kind==='text'){
      b.textContent=m.text||'';
    } else {
      var fn=document.createElement('div'); fn.className='fn'; fn.textContent=m.fileName||'文件'; b.appendChild(fn);
      var meta=document.createElement('div'); meta.className='meta'; meta.textContent=fmtSize(m.fileSize); b.appendChild(meta);
      var acts=document.createElement('div'); acts.className='acts';
      var dl=document.createElement('a'); dl.textContent='下载'; dl.href='/api/download?'+qs({id:m.fileId,code:CODE}); dl.setAttribute('download',m.fileName||'file'); acts.appendChild(dl);
      var mt=mediaType(m.fileName||'');
      if(mt){ var pv=document.createElement('button'); pv.className='g'; pv.textContent='预览'; pv.onclick=function(){ preview(m,mt); }; acts.appendChild(pv); }
      b.appendChild(acts);
    }
    // 时间 + 撤回（自己的消息，文本和文件都支持）
    var foot=document.createElement('div'); foot.className='meta'; foot.style.marginTop='4px'; foot.style.textAlign=mine?'right':'left';
    foot.textContent=fmtTime(m.time);
    b.appendChild(foot);
    if(mine){
      var rc=document.createElement('button'); rc.className='r'; rc.textContent='撤回'; rc.style.marginTop='3px';
      rc.onclick=function(){ recall(m.id); };
      b.appendChild(rc);
    }
    wrap.appendChild(b);
    box.appendChild(wrap);
  });
  if(nearBottom){ box.scrollTop = box.scrollHeight; seenTs = lastMaxT; $('newMsg').classList.add('hidden'); }
  else {
    var unread = msgs.filter(function(m){ return m.time > seenTs; }).length;
    if(unread>0){ var b2=$('newMsg'); b2.textContent='↓ '+unread+' 条新消息'; b2.classList.remove('hidden'); }
    else $('newMsg').classList.add('hidden');
  }
}
$('newMsg').onclick=function(){ var box=$('chat'); box.scrollTop=box.scrollHeight; seenTs=lastMaxT; $('newMsg').classList.add('hidden'); };

function preview(f,mt){
  var url='/api/download?'+qs({id:f.fileId,code:CODE,inline:1});
  var b=$('pvBody'); b.innerHTML='';
  var el;
  if(mt==='image'){ el=document.createElement('img'); }
  else if(mt==='video'){ el=document.createElement('video'); el.controls=true; }
  else { el=document.createElement('audio'); el.controls=true; }
  el.src=url;
  el.onerror=function(){ b.innerHTML='<div class="tip">预览加载失败，请改用「下载」</div>'; };
  b.appendChild(el);
  $('pvModal').classList.remove('hidden');
}
$('pvClose').onclick=function(){ $('pvBody').innerHTML=''; $('pvModal').classList.add('hidden'); };

// 页面内确认弹窗（不调用浏览器原生 confirm）
var cfCb=null;
function appConfirm(msg, yes){ $('cfText').textContent=msg; cfCb=yes; $('cfModal').classList.remove('hidden'); }
$('cfYes').onclick=function(){ $('cfModal').classList.add('hidden'); var f=cfCb; cfCb=null; if(f) f(); };
$('cfNo').onclick=function(){ $('cfModal').classList.add('hidden'); cfCb=null; };

// 离开房间 / 清空聊天（均走页面内确认弹窗）
function leaveRoom(){
  if(timer){ clearInterval(timer); timer=null; }
  try{ sessionStorage.removeItem('lan_code'); }catch(e){}
  CODE=''; AUTO=false; seenTs=0; lastMaxT=0;
  $('room').classList.add('hidden'); $('gate').classList.remove('hidden');
  $('gateErr').textContent=''; $('chat').innerHTML=''; $('newMsg').classList.add('hidden');
}
$('btnLeaveRoom').onclick=function(){
  appConfirm('确定离开房间？离开后需重新输入口令加入。', function(){ leaveRoom(); });
};
$('btnClear').onclick=function(){
  appConfirm('清空当前聊天显示？只对你自己生效，不影响其他成员。', function(){
    clearTs = Date.now();
    try{ sessionStorage.setItem('lan_clear_ts', String(clearTs)); }catch(e){}
    seenTs=0; $('newMsg').classList.add('hidden'); poll();
    setStatus('聊天显示已清空');
  });
};

function recall(id){
  appConfirm('撤回这条消息？', function(){ doRecall(id); });
}
function doRecall(id){
  fetch('/api/recall?'+qs({code:CODE}),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'me='+encodeURIComponent(ME)+'&id='+encodeURIComponent(id)})
    .then(function(r){ return r.json(); }).then(function(d){ setStatus(d.ok?'已撤回':'撤回失败：'+(d.msg||''),!d.ok); poll(); })
    .catch(function(){ setStatus('撤回失败'); });
}

function uploadOne(file, pathName){
  return new Promise(function(resolve){
    var x=new XMLHttpRequest();
    x.open('POST','/api/upload?'+qs({code:CODE,me:ME,name:NAME,filename:pathName}));
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=function(e){ if(e.lengthComputable) setStatus('正在上传 '+pathName+' · '+Math.round(e.loaded/e.total*100)+'%'); };
    x.onload=function(){ resolve(x.status===200); };
    x.onerror=function(){ resolve(false); };
    x.send(file);
  });
}

function uploadList(list){
  if(!list.length) return;
  var i=0;
  (function next(){
    if(i>=list.length){ setStatus('全部上传完成'); poll(); return; }
    var f=list[i++];
    var nm = (f.webkitRelativePath && f.webkitRelativePath.indexOf('/')>0) ? f.webkitRelativePath : f.name;
    setStatus('准备上传 '+nm);
    uploadOne(f, nm).then(function(ok){ setStatus(ok?('已上传 '+nm):('上传失败 '+nm),!ok); setTimeout(next,150); });
  })();
}

$('btnJoin').onclick=join;
$('code').addEventListener('keydown',function(e){ if(e.key==='Enter') join(); });
$('name').addEventListener('keydown',function(e){ if(e.key==='Enter') join(); });
$('btnSend').onclick=sendText;
$('text').addEventListener('keydown',function(e){ if(e.key==='Enter') sendText(); });
function sendText(){
  var t=($('text').value||'').trim();
  if(!t) return;
  $('text').value='';
  fetch('/api/chat?'+qs({code:CODE,me:ME,name:NAME}),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'text='+encodeURIComponent(t)})
    .then(function(r){ return r.json(); }).then(function(d){ if(!d.ok) setStatus(d.msg||'发送失败',true); else { seenTs = Date.now(); poll(); } })
    .catch(function(){ setStatus('发送失败'); });
}
$('btnFile').onclick=function(){ $('file').click(); };
$('file').onchange=function(e){ uploadList(Array.prototype.slice.call(e.target.files||[])); e.target.value=''; };
$('btnFolder').onclick=function(){ $('folder').click(); };
$('folder').onchange=function(e){ uploadList(Array.prototype.slice.call(e.target.files||[])); e.target.value=''; };

if(CODE){
  query('/api/chat',{code:CODE,name:NAME,me:ME}).then(function(d){
    if(d.ok) enter();
    else if(AUTO) $('gateErr').textContent='链接里的口令已失效，请向主机确认后重新输入';
  }).catch(function(){
    if(AUTO) $('gateErr').textContent='连不上主机，请确认已连接同一 Wi-Fi';
  });
}
</script>
</body>
</html>
